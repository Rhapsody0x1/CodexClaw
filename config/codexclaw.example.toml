[general]
data_dir = "~/.codex-claw/data"
system_codex_home = "~/.codex"
codex_home_global = "~/.codex-claw/.codex"
default_workspace_dir = "~/.codex-claw/data/session/workspace"
codex_binary = "codex"
default_model = "gpt-5.4"
default_reasoning_effort = "medium"
self_repo_dir = "."
self_build_command = "cargo build --release"
self_binary_path = "./target/release/codex-claw"

[qq]
app_id = "YOUR_APP_ID"
app_secret = "YOUR_APP_SECRET"
api_base_url = "https://sandbox.api.sgroup.qq.com"
token_url = "https://bots.qq.com/app/getAppAccessToken"

[shadow]
# Hermes-style background distillation of memory (~/.codex-claw/data/memory/<openid>/*.md)
# and Skill (~/.codex-claw/.codex/skills/claw-*/SKILL.md). Runs silently after each turn.
enabled = true
memory_min_user_chars = 40
memory_reasoning = "low"
memory_model = ""              # empty = follow session model
memory_deadline_secs = 120
skill_files_threshold = 2
skill_tool_threshold = 5

[scheduler]
enabled = true
tick_secs = 30
default_tz = "Asia/Shanghai"
max_concurrent_jobs = 4
max_turn_secs = 600
max_attempts = 3
retry_backoff_secs = 30
circuit_breaker_threshold = 5
runs_retention = 30

# Optional: Grok / xAI-style backend (used at bootstrap when enabled, and by /switch_model → grok).
# [codex_provider]
# enabled = true
# id = "xai"
# name = "xAI Grok"
# base_url = "https://api.x.ai/v1"
# env_key = "XAI_API_KEY"
# wire_api = "responses"
# set_as_default = true
# default_model = "grok-4.5"
# models = ["grok-4", "grok-4.5", "grok-3", "grok-3-mini"]

# Preferred backend when /switch_model → codex (third-party OpenAI-compatible mirror).
# Without this, switch tries to re-activate a non-Grok provider already in config.toml;
# if none exists it clears model_provider and may hit official api.openai.com (wrong for mirror keys).
# [openai_provider]
# enabled = true
# id = "mirror"
# name = "mirror"
# base_url = "https://chat.soruxgpt.com/codex"
# env_key = "OPENAI_API_KEY"
# wire_api = "responses"
# default_model = "gpt-5.5"
# requires_openai_auth = false
# preferred_auth_method = "apikey"
